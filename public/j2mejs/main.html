<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <title>J2meJS Runtime</title>
  <link rel="stylesheet" type="text/css" href="style/main.css" />
  <style>
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      overscroll-behavior: none !important;
      touch-action: none !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      background: #080a0e !important;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #display-container {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: #000 !important;
    }
    #display {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      background: #000 !important;
    }
    #header, #keypad {
      display: none !important;
    }
    #canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      image-rendering: pixelated !important;
      image-rendering: crisp-edges !important;
      border: 0 !important;
      outline: none !important;
      background: #000;
      touch-action: none !important;
    }
    .screen {
      position: absolute !important;
      inset: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      background: #0d1017 !important;
      color: #f8fafc !important;
      text-align: center !important;
      padding: 16px !important;
      z-index: 20 !important;
    }
    .screen .title {
      font-size: 13px !important;
      font-weight: 600 !important;
      margin: 0 0 10px 0 !important;
      color: #f8fafc !important;
    }
    progress {
      width: 150px;
      accent-color: #f59e0b;
    }
    #exit-screen {
      display: none !important;
      background: #0d1017 !important;
      color: #fbbf24 !important;
      font-size: 13px !important;
      padding: 18px !important;
    }
    #background-screen {
      display: none !important;
    }
  </style>
  <script src="libs/encoding.js"></script>
  <script src="libs/webaudio-tinysynth.min.js" type="text/javascript"></script>
  <script src="libs/BenzAMRRecorder.min.js" type="text/javascript"></script>
  <script type="text/javascript" src="bld/native.js" defer></script>
  <script type="text/javascript" src="config/default.js" defer></script>
  <script type="text/javascript" src="config/runtests.js" defer></script>
  <script type="text/javascript" src="config/build.js" defer></script>
  <script type="text/javascript" src="config/urlparams.js" defer></script>
  <script type="text/javascript" src="bld/j2me.js" defer></script>
  <script type="text/javascript" src="bld/main-all.js" defer></script>
  <script type="text/javascript" src="keymap.js" defer></script>
</head>
<body>
  <input id="File" type="file" style="visibility: hidden; display: none;" />
  <div id="display-container">
    <div id="display">
      <div id="header"></div>
      <canvas id="canvas" tabindex="0"></canvas>
      <div id="download-screen" class="screen">
        <h1 class="title">Đang nạp máy ảo J2meJS...</h1>
        <div class="download-progress-container">
          <progress class="pack-activity" id="download-bar" value="0" max="100"></progress>
        </div>
      </div>
      <div id="splash-screen" class="screen">
        <h1 class="title">Đang khởi chạy MIDlet...</h1>
        <div class="splash-progress-container">
          <progress></progress>
        </div>
      </div>
      <div id="exit-screen" class="screen">MIDlet đã thoát</div>
      <div id="background-screen"></div>
    </div>
  </div>
  <div id="keypad" class="gamepad-0"></div>

  <script>
    (function () {
      var announcedRunning = false;
      var isMuted = new URLSearchParams(location.search).get("muted") === "1";

      function notifyParent(payload) {
        try {
          window.parent.postMessage(payload, "*");
        } catch (e) {}
      }

      function checkReadyPaint() {
        if (announcedRunning) return;
        var splash = document.getElementById("splash-screen");
        var dl = document.getElementById("download-screen");
        var canvas = document.getElementById("canvas");
        if ((!splash || !splash.parentNode) && (!dl || !dl.parentNode) && canvas) {
          announcedRunning = true;
          notifyParent({
            type: "vm-status",
            status: "running",
            message: "Đang chạy J2meJS (" + canvas.width + "×" + canvas.height + ")"
          });
          return;
        }
        requestAnimationFrame(checkReadyPaint);
      }

      window.addEventListener("load", function () {
        requestAnimationFrame(checkReadyPaint);
      });

      window.addEventListener("message", function (e) {
        var d = e.data;
        if (!d || typeof d !== "object") return;
        if (d.type === "key" && typeof MIDP !== "undefined") {
          try {
            if (d.down) {
              if (typeof MIDP.sendKeyPress === "function") MIDP.sendKeyPress(d.keyCode);
            } else {
              if (typeof MIDP.sendKeyRelease === "function") MIDP.sendKeyRelease(d.keyCode);
            }
          } catch (err) {
            console.warn("Key dispatch error:", err);
          }
        } else if (d.type === "pointer" && typeof MIDP !== "undefined") {
          try {
            if (typeof MIDP.sendPenEvent === "function") {
              var whichType = d.action === "down" ? 1 : (d.action === "up" ? 2 : 3);
              MIDP.sendPenEvent({ x: Math.round(d.x), y: Math.round(d.y) }, whichType);
            }
          } catch (err) {
            console.warn("Pointer dispatch error:", err);
          }
        } else if (d.type === "text" && typeof MIDP !== "undefined") {
          try {
            var textStr = typeof d.text === "string" ? d.text : "";
            if (textStr && window.__j2meLcdui && window.__j2meLcdui.isActive()) {
              window.__j2meLcdui.insertText(textStr);
            } else if (textStr && typeof MIDP.sendKeyPress === "function" && typeof MIDP.sendKeyRelease === "function") {
              (function dispatchChars(str) {
                var idx = 0;
                function step() {
                  if (idx >= str.length) return;
                  var code = str.charCodeAt(idx++);
                  MIDP.sendKeyPress(code);
                  setTimeout(function () {
                    MIDP.sendKeyRelease(code);
                    if (idx < str.length) setTimeout(step, 35);
                  }, 45);
                }
                step();
              })(textStr);
            }
          } catch (err) {
            console.warn("Text dispatch error:", err);
          }
        } else if (d.type === "mute") {
          isMuted = !!d.muted;
          try {
            if (window.midiplayer && typeof window.midiplayer.setMasterVol === "function") {
              window.midiplayer.setMasterVol(isMuted ? 0 : 0.5);
            }
          } catch (err) {}
        }
      });
    })();
  </script>
</body>
</html>
